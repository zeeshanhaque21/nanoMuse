name: Website

# Publishes site/ to GitHub Pages: https://nano-muse.github.io/nanoMuse/
# This project page is a redirect to the project's own pages site, with the earlier page kept at
# legacy.html (its generated parts — the dragon's five moods, icons, fonts, screenshots — are copied
# from web/ and docs/ below). fork: no redirect target outside this fork's own GitHub Pages is used.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "web/public/avatars/dragon-*.webp"
      - "web/public/icon.svg"
      - "web/public/mark.svg"
      - "docs/screenshots/**"
      - "docs/cover.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assemble site/assets — the dragon, the icons, the fonts, the screenshots
        run: |
          mkdir -p site/assets/fonts site/assets/screens
          cp web/public/icon.svg web/public/mark.svg web/public/avatars/dragon-*.webp site/assets/
          cp web/public/fonts/figtree-latin.woff2 web/public/fonts/figtree-latin-ext.woff2 web/public/fonts/OFL.txt site/assets/fonts/
          cp docs/screenshots/*.png site/assets/screens/
          cp docs/cover.png site/assets/cover.png
          cat > site/assets/mascot.js <<'JS'
          // generated by .github/workflows/pages.yml — the dragon, one picture per mood
          window.NANOMUSE_MASCOT = (function () {
            var img = function (m) { return '<img src="assets/dragon-' + m + '.webp" alt="" width="200" height="200">'; };
            return { idle: img("idle"), working: img("working"), waiting: img("waiting"), happy: img("happy"), error: img("error"), sleepy: img("idle") };
          })();
          JS
          echo '.clip img { width: 100%; height: 100%; object-fit: cover; }' > site/assets/mascot.css
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
