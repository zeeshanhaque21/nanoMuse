<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>nanoMuse hands</title>
<style>
  /* A transparent, click-through, always-on-top window over the whole display while the hands
     work (UI-TARS's ScreenMarker, in our colours): a water-flow gradient runs along the edges
     and the agent's face follows the pointer. Nothing here is ever in a screenshot: the window
     has content protection on. */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; pointer-events: none; }
  .edge { position: fixed; inset: 0; border-radius: 14px; padding: 6px; opacity: 0; transition: opacity 240ms ease; 
    background: conic-gradient(from var(--a), #22c1ff, #7a5cff, #ff6ab0, #ffb347, #22c1ff);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
    filter: blur(0.3px) saturate(1.2); }
  .on .edge { opacity: 0.95; animation: flow 3.2s linear infinite; }
  .held .edge { background: conic-gradient(from var(--a), #f5b027, #ffd77a, #f5b027); }
  @property --a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
  @keyframes flow { to { --a: 360deg; } }
  .glow { position: fixed; inset: 0; box-shadow: inset 0 0 60px 12px rgba(80, 140, 255, 0.28); opacity: 0; transition: opacity 240ms ease; border-radius: 14px; }
  .on .glow { opacity: 1; }
  .cursor { position: fixed; left: 0; top: 0; width: 44px; height: 44px; transform: translate(-50%, -50%) scale(0.6); opacity: 0; transition: left 180ms ease-out, top 180ms ease-out, opacity 160ms ease, transform 160ms ease; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.45)); }
  .cursor.shown { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .cursor img { width: 100%; height: 100%; border-radius: 50%; background: #fff; display: block; }
  .cursor .ring { position: absolute; inset: -6px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.9); opacity: 0; }
  .cursor.click .ring { animation: ring 520ms ease-out; }
  @keyframes ring { from { transform: scale(0.6); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
  .label { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); padding: 6px 14px; border-radius: 999px; background: rgba(20,20,24,0.85); color: #fff; font: 500 13px/1.3 -apple-system, "Segoe UI", system-ui, sans-serif; opacity: 0; transition: opacity 200ms ease; max-width: 60vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .on .label.shown { opacity: 1; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="edge"></div>
  <div class="cursor" id="cursor"><span class="ring"></span><img id="face" alt="" /></div>
  <div class="label" id="label"></div>
  <script>
    const root = document.body
    const cursor = document.getElementById('cursor')
    const face = document.getElementById('face')
    const label = document.getElementById('label')
    let clickTimer = 0
    // The shell sends {active, held, x, y, kind, text, face} with x,y as fractions of the display.
    window.nanomuseGlow?.onState((s) => {
      root.classList.toggle('on', Boolean(s.active))
      root.classList.toggle('held', Boolean(s.held))
      if (s.face && face.getAttribute('src') !== s.face) face.setAttribute('src', s.face)
      if (s.active && typeof s.x === 'number' && typeof s.y === 'number' && s.x >= 0 && s.y >= 0) {
        cursor.style.left = `${s.x * 100}%`
        cursor.style.top = `${s.y * 100}%`
        cursor.classList.add('shown')
        if (s.kind === 'click' || s.kind === 'tap' || s.kind === 'double_click') {
          cursor.classList.remove('click'); void cursor.offsetWidth; cursor.classList.add('click')
          clearTimeout(clickTimer); clickTimer = setTimeout(() => cursor.classList.remove('click'), 600)
        }
      } else cursor.classList.remove('shown')
      if (s.text) { label.textContent = s.text; label.classList.add('shown') } else label.classList.remove('shown')
    })
  </script>
</body>
</html>
